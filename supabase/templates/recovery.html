<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fbf8f2;font-family:Arial,sans-serif;color:#1f2d5a">
    <div style="max-width:560px;margin:0 auto;padding:40px 20px">
      <div style="background:#ffffff;border:1px solid #ead7ae;border-radius:8px;padding:36px">
        <p style="margin:0 0 12px;color:#c58d1c;font-size:13px;font-weight:700;text-transform:uppercase">Online Qaria</p>
        <h1 style="margin:0 0 18px;font-family:Georgia,serif;font-size:28px">Reset your admin password</h1>
        <p style="margin:0 0 14px;color:#5b6275;font-size:16px;line-height:1.7">Assalamu Alaikum,</p>
        <p style="margin:0 0 24px;color:#5b6275;font-size:16px;line-height:1.7">A password reset was requested for your Online Qaria admin account. Use the secure button below to choose a new password.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f2d5a;color:#ffffff;padding:14px 24px;border-radius:6px;text-decoration:none;font-weight:700">Reset password</a>
        <p style="margin:28px 0 0;color:#737887;font-size:13px;line-height:1.6">If you did not request this change, ignore this email and your password will remain unchanged.</p>
      </div>
    </div>
  </body>
</html>
